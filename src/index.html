<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyewall prototype</title>
<style>
html,body{margin:0;height:100%;background:#05080c;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe3f2}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:14px;top:14px;font-size:11.5px;line-height:1.55;letter-spacing:.04em;background:rgba(6,14,22,.62);border:1px solid rgba(110,170,210,.28);padding:10px 12px 9px;min-width:236px;backdrop-filter:blur(3px);text-transform:uppercase}
#hud b{color:#fff;font-weight:600} #hud .k{color:#7fa6c2} #hud .hd{color:#9fd0f0;border-bottom:1px solid rgba(110,170,210,.25);margin-bottom:5px;padding-bottom:4px;display:flex;justify-content:space-between;gap:10px}
#hud .cat{color:#ff7a59} #hud .row{display:flex;justify-content:space-between;gap:14px}
#help{position:fixed;right:14px;bottom:12px;font-size:10.5px;line-height:1.6;color:#9db8cb;background:rgba(6,14,22,.55);border:1px solid rgba(110,170,210,.2);padding:8px 10px;text-transform:uppercase;letter-spacing:.05em;max-width:330px}
#help b{color:#e8f3fa;font-weight:600}
#note{position:fixed;left:14px;bottom:12px;font-size:10px;color:#86a3b8;max-width:420px;letter-spacing:.03em;text-shadow:0 1px 2px #000}
#map{position:fixed;right:14px;top:14px;width:190px;height:190px;background:rgba(6,14,22,.62);border:1px solid rgba(110,170,210,.28);backdrop-filter:blur(3px)}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s ease}
#title svg{width:min(64vw,780px);filter:drop-shadow(0 3px 18px rgba(0,0,0,.55));transform:scale(1.14);transition:transform 1.1s cubic-bezier(.16,.9,.25,1)}
#title.on{opacity:1;transition:opacity .07s linear}
#title.on svg{transform:scale(1)}
@media (prefers-reduced-motion:reduce){#title svg{transition:none;transform:none}}
#fps{position:fixed;left:50%;top:10px;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#d7e6f0;text-shadow:0 1px 3px #000;pointer-events:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:14px;line-height:1.6;background:#05080c}
#skip{position:fixed;right:16px;top:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#d7e6f0;background:rgba(6,14,22,.5);border:1px solid rgba(160,200,230,.35);padding:7px 12px;cursor:pointer;display:none}
#time{position:fixed;left:14px;bottom:44px;display:flex;align-items:center;gap:4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(6,14,22,.62);border:1px solid rgba(110,170,210,.28);padding:5px 6px 5px 10px;backdrop-filter:blur(3px)}
#time .clk{color:#9fd0f0;margin-right:6px}
#time button{font:inherit;color:#cfe3f2;background:transparent;border:1px solid rgba(110,170,210,.25);padding:4px 8px;cursor:pointer;letter-spacing:.06em}
#time button.on{background:rgba(159,208,240,.18);border-color:rgba(159,208,240,.7);color:#fff}
#gl-arch,#gl-info{position:fixed;top:14px;background:rgba(5,12,20,.78);border:1px solid rgba(110,170,210,.26);backdrop-filter:blur(4px);font-size:11px;letter-spacing:.04em;color:#cfe3f2}
#gl-arch{left:14px;bottom:14px;width:286px;display:flex;flex-direction:column}
#gl-info{right:14px;width:318px;max-height:calc(100% - 28px);overflow:auto;padding-bottom:10px}
.gh{padding:11px 12px 9px;border-bottom:1px solid rgba(110,170,210,.2);display:flex;flex-direction:column;gap:3px}
.gh b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;font-weight:600}.gh span{color:#7fa6c2;text-transform:uppercase;font-size:10px}
.gf{display:flex;gap:4px;padding:7px 10px 0;flex-wrap:wrap}
.gf select,.gf input{flex:1;min-width:0;font:inherit;color:#e8f3fa;background:rgba(10,24,38,.9);border:1px solid rgba(110,170,210,.3);padding:5px 6px}
.gf button,#gl-go{font:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#9db8cb;background:transparent;border:1px solid rgba(110,170,210,.25);padding:4px 7px;cursor:pointer}
.gf button.on{color:#fff;background:rgba(159,208,240,.16);border-color:rgba(159,208,240,.65)}
#gl-live{border-bottom:1px solid rgba(110,170,210,.2);padding:2px 4px 6px}#gl-live p{margin:2px 8px 4px;color:#7fa6c2;line-height:1.45}#gl-live p.warn{color:#ff9a6b}#gl-live a{color:#9fd0f0}
#gl-live .lh{display:flex;align-items:center;gap:7px;padding:7px 8px 4px;text-transform:uppercase;font-size:10px}#gl-live .lh b{color:#fff;font-weight:600;letter-spacing:.08em}#gl-live .lh span{margin-left:auto;color:#6f8ea5;text-transform:none}
#gl-live .dot{width:7px;height:7px;border-radius:50%;background:#4d6577}#gl-live .dot.on{background:#ff6145;box-shadow:0 0 0 0 rgba(255,97,69,.6);animation:lp 1.6s infinite}@keyframes lp{70%{box-shadow:0 0 0 7px rgba(255,97,69,0)}100%{box-shadow:0 0 0 0 rgba(255,97,69,0)}}
#gl-live .row{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;border-left:2px solid rgba(255,97,69,.55)}#gl-live .row:hover{background:rgba(255,97,69,.14)}#gl-live .row.sel{background:rgba(255,97,69,.2)}
#gl-live .row b{font-weight:600;color:#fff;min-width:84px}#gl-live .row span{color:#c9a99f;font-size:10px}
.gh em{font-style:normal;padding:0 4px;border:1px solid}.gh em.live{color:#ff8a70;border-color:rgba(255,97,69,.6)}.gh em.demo{color:#ffd27a;border-color:rgba(255,210,122,.5)}
#gl-count{padding:8px 12px 4px;color:#7fa6c2;text-transform:uppercase;font-size:10px}
#gl-list{flex:1;overflow:auto;padding:0 4px 8px}
#gl-list .row{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;border-left:2px solid transparent}
#gl-list .row:hover{background:rgba(110,170,210,.1)}#gl-list .row.sel{background:rgba(159,208,240,.14);border-left-color:#9fd0f0}
#gl-list .row b{font-weight:600;color:#fff;min-width:84px}#gl-list .row span{color:#7fa6c2;font-size:10px}
.cc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#gl-info .row2{display:flex;justify-content:space-between;gap:12px;padding:3px 12px}#gl-info .row2 .k{color:#7fa6c2;text-transform:uppercase;font-size:10px;padding-top:1px}#gl-info .row2 b{color:#fff;font-weight:600;text-align:right}
#gl-info .sec{margin:10px 12px 4px;padding-top:8px;border-top:1px solid rgba(110,170,210,.18);color:#9fd0f0;text-transform:uppercase;font-size:10px;letter-spacing:.1em}
#gl-info p{margin:5px 12px;line-height:1.5}#gl-info .dim{color:#7fa6c2;font-size:10.5px}#gl-info .warn{color:#ff9a6b}
#gl-info .src{padding:2px 12px}#gl-info a{color:#9fd0f0;font-size:10.5px}
#gl-slide{width:calc(100% - 24px);margin:6px 12px 4px;accent-color:#9fd0f0}
#gl-go{display:block;margin:10px 12px 4px;width:calc(100% - 24px);padding:9px;font-size:11.5px;color:#fff;border-color:rgba(255,122,89,.75);background:rgba(255,122,89,.16)}
#gl-go:disabled{opacity:.35;cursor:default}
#gl-legend{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 680px);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#9db8cb;background:rgba(5,12,20,.7);border:1px solid rgba(110,170,210,.2);padding:6px 10px}
#gl-legend em a{color:#9fd0f0;pointer-events:auto}#gl-legend em{flex-basis:100%;text-align:center;font-style:normal;text-transform:none;color:#6f8ea5;letter-spacing:.02em}
#gl-tip{position:fixed;display:none;pointer-events:none;font-size:11px;color:#e8f3fa;background:rgba(5,12,20,.88);border:1px solid rgba(110,170,210,.35);padding:4px 8px;z-index:5}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.1s ease .45s}#fade.on{opacity:1}
.hide{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"></div>
<div id="help" class="hide"></div>
<div id="note" class="hide">Conditions are reconstructed from NOAA best-track measurements with parametric wind and wave models. They are not recordings.</div>
<canvas id="map" class="hide" width="380" height="380"></canvas>
<div id="time" class="hide"></div>
<div id="gl-arch" class="hide"></div><div id="gl-info" class="hide"></div><div id="gl-legend" class="hide"></div><div id="gl-tip"></div><div id="fade"></div>
<div id="title"><svg viewBox="-10 -10 588 120" aria-label="Eyewall"><defs><clipPath id="cap"><rect x="-10" y="0" width="588" height="100"/></clipPath></defs>
<g clip-path="url(#cap)" fill="none" stroke="#fff" stroke-width="16" stroke-linejoin="miter" stroke-miterlimit="6">
<path d="M8,-5V105M0,8H58M8,50H50M0,92H58"/>
<path transform="translate(72)" d="M4,-8L38,54L72,-8M38,50V105"/>
<path transform="translate(162)" d="M8,-5V105M0,8H58M8,50H50M0,92H58"/>
<path transform="translate(234)" d="M5,-8L29,92L52,10L75,92L99,-8"/>
<path transform="translate(352)" d="M4,108L40,2L76,108M20,68H60"/>
<path transform="translate(446)" d="M8,-5V92H54"/>
<path transform="translate(514)" d="M8,-5V92H54"/>
</g></svg></div>
<div id="fps"></div>
<button id="skip">Skip intro</button>
<div id="msg"></div>
<script>/*__JS__*/</script>
</body></html>
